openapi: 3.0.0
info:
  title: Job's REST API
  version: '1.0'
paths:
  /jobs:
    post:
      description: Creates a new job
      tags:
        - Job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createJob"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
  /jobs/{jobId}:
    get:
      description: Retrieve a job
      tags:
        - Job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
        404:
          description: NOT FOUND
    put:
      description: Update a job
      tags:
        - Job
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createJob"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/job"
        400:
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        404:
          description: NOT FOUND

components:
  schemas:

    createJob:
      type: object
      properties:
        name:
          type: string
          example: job-name
        execution:
          $ref: "#/components/schemas/createExecutionConfiguration"
        scraping:
          $ref: "#/components/schemas/createScrapingConfiguration"
      required:
        - name
        - execution
        - scraping

    job:
      type: object
      properties:
        id:
          type: integer
          example: 123
        name:
          type: string
          example: job-name
        execution:
          $ref: "#/components/schemas/executionConfiguration"
        scraping:
          $ref: "#/components/schemas/scrapingConfiguration"
      required:
        - id
        - name
        - execution
        - scraping

    createExecutionConfiguration:
      type: object
      properties:
        tasksPerSecond:
          type: number
          minimum: 0
          exclusiveMinimum: true
          example: 5
      required:
        - tasksPerSecond

    executionConfiguration:
      type: object
      allOf:
        - $ref: "#/components/schemas/createExecutionConfiguration"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    createScrapingConfiguration:
      type: object
      properties:
        itemSelector:
          type: string
          example: main#content
          description: Css selector
        dataPoints:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/writeAttributeExtractionConfigurationDto"
              - $ref: "#/components/schemas/writeDescriptionListExtractionConfigurationDto"
              - $ref: "#/components/schemas/writeHtmlExtractionConfigurationDto"
              - $ref: "#/components/schemas/writeImageExtractionConfigurationDto"
              - $ref: "#/components/schemas/writeTextExtractionConfigurationDto"
            discriminator:
              propertyName: type
          minItems: 1
      required:
        - itemSelector
        - dataPoints

    scrapingConfiguration:
      type: object
      properties:
        id:
          type: integer
          example: 123
        itemSelector:
          type: string
          example: main#content
          description: Css selector
        dataPoints:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/readAttributeExtractionConfigurationDto"
              - $ref: "#/components/schemas/readDescriptionListExtractionConfigurationDto"
              - $ref: "#/components/schemas/readHtmlExtractionConfigurationDto"
              - $ref: "#/components/schemas/readImageExtractionConfigurationDto"
              - $ref: "#/components/schemas/readTextExtractionConfigurationDto"
            discriminator:
              propertyName: type
          minItems: 1
      required:
        - id
        - itemSelector
        - dataPoints

    writeAttributeExtractionConfigurationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - ATTRIBUTE
        field:
          type: string
          example: output.field
        attribute:
          type: string
        selector:
          type: string
      required:
        - type
        - selector
        - field
        - attribute

    readAttributeExtractionConfigurationDto:
      type: object
      allOf:
        - $ref: "#/components/schemas/writeAttributeExtractionConfigurationDto"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    writeDescriptionListExtractionDataPointConfigurationDto:
      type: object
      properties:
        dtValue:
          type: string
        field:
          type: string
      required:
        - dtValue
        - field

    readDescriptionListExtractionDataPointConfigurationDto:
      type: object
      allOf:
        - $ref: "#/components/schemas/writeDescriptionListExtractionDataPointConfigurationDto"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    writeDescriptionListExtractionConfigurationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - DESCRIPTION_LIST
        dataPoints:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/writeDescriptionListExtractionDataPointConfigurationDto"
        selector:
          type: string
      required:
        - type
        - selector
        - dataPoints

    readDescriptionListExtractionConfigurationDto:
      type: object
      properties:
        id:
          type: integer
          example: 123
        type:
          type: string
          enum:
            - DESCRIPTION_LIST
        selector:
          type: string
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/readDescriptionListExtractionDataPointConfigurationDto"
      required:
        - id
        - type
        - selector
        - dataPoints

    writeHtmlExtractionConfigurationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - HTML
        field:
          type: string
        selector:
          type: string
      required:
        - type
        - selector
        - field

    readHtmlExtractionConfigurationDto:
      type: object
      allOf:
        - $ref: "#/components/schemas/writeHtmlExtractionConfigurationDto"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    writeImageExtractionConfigurationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - IMAGE
      required:
        - type

    readImageExtractionConfigurationDto:
      type: object
      allOf:
        - $ref: "#/components/schemas/writeImageExtractionConfigurationDto"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    writeTextExtractionConfigurationDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - TEXT
        field:
          type: string
        selector:
          type: string
      required:
        - type
        - selector
        - field

    readTextExtractionConfigurationDto:
      type: object
      allOf:
        - $ref: "#/components/schemas/writeTextExtractionConfigurationDto"
      properties:
        id:
          type: integer
          example: 123
      required:
        - id

    errorResponse:
      type: object
      description: Returned for validation errors and invalid arguments (ErrorResponseDto).
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string
            example: Job name must be unique.
      required:
        - timestamp
        - status
        - errors