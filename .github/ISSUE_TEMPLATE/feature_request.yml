name: Feature request
description: Suggest an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement!

        Please describe the problem or use case first. This helps us understand the motivation behind the request and prioritise it appropriately based on the needs of the community.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe your use case or workflow.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Describe your proposed solution, if you have one.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: How are you solving this today?

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I would be interested in contributing this feature.