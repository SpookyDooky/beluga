openapi: 3.0.0
info:
  title: Results REST API
  version: '1.0'
paths:
  /jobs/{jobId}/executions/{executionId}/results:
    get:
      description: Retrieve all scraped data for a job
      tags:
        - Results
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job to retrieve the results for
        - in: path
          name: executionId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of an execution of a job
        - in: query
          name: size
          required: false
          schema:
            type: integer
            example: 100
            default: 50
          description: Page size
        - in: query
          name: page
          required: false
          schema:
            type: integer
            example: 1
            default: 0
          description: Page index
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedJobExecutionResults"
        404:
          description: Not found
  /jobs/{jobId}/executions/{executionId}/tasks/{taskId}/results:
    get:
      description: Retrieve the scraped data of a single task execution
      tags:
        - Results
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job to retrieve the results for
        - in: path
          name: executionId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of an execution of a job
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of a task execution (see GET /jobs/{jobId}/executions/{executionId})
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskExecutionResult"
        404:
          description: Not found
  /jobs/{jobId}/executions/{executionId}/tasks/{taskId}/results/files:
    get:
      description: List the stored result files of a task execution
      tags:
        - Results
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job to retrieve the results for
        - in: path
          name: executionId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of an execution of a job
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of a task execution (see GET /jobs/{jobId}/executions/{executionId})
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskResultFile"
        404:
          description: Not found
  /jobs/{jobId}/executions/{executionId}/tasks/{taskId}/results/files/download:
    get:
      description: Download a stored result file of a task execution
      tags:
        - Results
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job to retrieve the results for
        - in: path
          name: executionId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of an execution of a job
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of a task execution (see GET /jobs/{jobId}/executions/{executionId})
        - in: query
          name: fileName
          required: true
          schema:
            type: string
            example: data.json
          description: Stored file key of the task execution, for example data.json or source.html
      responses:
        200:
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        404:
          description: Not found

components:
  schemas:

    PaginatedJobExecutionResults:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/TaskExecutionResult"
        pageable:
          $ref: "#/components/schemas/Pageable"
        totalPages:
          type: integer
          example: 10
        totalElements:
          type: integer
          example: 500
        last:
          type: boolean
          example: false
        size:
          type: integer
          example: 2
        number:
          type: integer
          example: 1
        sort:
          $ref: "#/components/schemas/Sort"
        numberOfElements:
          type: integer
          example: 500
        first:
          type: boolean
          example: false
        empty:
          type: boolean
          example: false
      required:
        - content
        - pageable
        - totalPages
        - totalElements
        - last
        - size
        - number
        - sort
        - numberOfElements
        - first
        - empty

    Pageable:
      type: object
      properties:
        sort:
          $ref: "#/components/schemas/Sort"
        pageNumber:
          type: integer
          example: 0
        pageSize:
          type: integer
          example: 50
        offset:
          type: integer
          example: 0
        paged:
          type: boolean
          example: true
        unpaged:
          type: boolean
          example: false
      required:
        - sort
        - pageNumber
        - pageSize
        - offset
        - paged
        - unpaged

    Sort:
      type: object
      properties:
        sorted:
          type: boolean
          example: false
        unsorted:
          type: boolean
          example: true
        empty:
          type: boolean
          example: false
      required:
        - sorted
        - unsorted
        - empty

    TaskExecutionResult:
      type: object
      properties:
        taskId:
          type: integer
          example: 123
        data:
          type: array
          items:
            type: object
            description: JSON object representing the scraped data
      required:
        - taskId
        - data

    TaskResultFile:
      type: object
      properties:
        id:
          type: integer
          example: 42
        resourceIdentifier:
          type: string
          example: /app/data/123/321/1/data.json
          description: "{prefix}/{jobId}/{executionId}/{taskId}/{fileName}"
        sizeInBytes:
          type: integer
          example: 123
      required:
        - id
        - resourceIdentifier
        - sizeInBytes