openapi: 3.0.0
info:
  title: Task REST API
  version: '1.0'
paths:
  /jobs/{jobId}/tasks:
    put:
      description: Update the tasks for a job. This only guarantees that a given url exists for a job as a task, if it already existed no new task is created.
      tags:
        - Task
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job for which to update the tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/updateTasksDto"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadTaskDefinitionDto"
        400:
          description: Invalid request, for example a null or malformed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        404:
          description: Job not found
    get:
      description: Retrieve the active tasks of a job
      tags:
        - Task
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadTaskDefinitionDto"
        404:
          description: Job not found
    patch:
      description: Update the tasks for a job by adding and/or removing tasks. Add only guarantees that the url will exist as a task, if it already existed that one is used. The same for remove, if it was already removed it won't do anything.
      tags:
        - Task
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job for which to update the tasks
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/patchTaskDto"
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadTaskDefinitionDto"
        400:
          description: Invalid request, for example a null or malformed URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/errorResponse"
        404:
          description: Job not found
  /jobs/{jobId}/tasks/{taskId}:
    get:
      description: Retrieves a specific task definition, including removed (inactive) ones
      tags:
        - Task
      parameters:
        - in: path
          name: jobId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the job
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
            example: 123
          description: Id of the task definition (not a task execution id)
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadTaskDefinitionDto"
        404:
          description: Not found

components:
  schemas:

    updateTasksDto:
      type: object
      properties:
        urls:
          type: array
          items:
            type: string
            example: https://some.host.com/some/path
      required:
        - urls

    ReadTaskDefinitionDto:
      type: object
      properties:
        id:
          type: integer
          example: 123
        url:
          type: string
          example: https://some.host.com/some/path
      required:
        - id
        - url

    errorResponse:
      type: object
      description: Returned for validation errors and invalid arguments (ErrorResponseDto).
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
          example: 400
        errors:
          type: array
          items:
            type: string
            example: A URL must not be null.
      required:
        - timestamp
        - status
        - errors

    patchTaskDto:
      type: object
      properties:
        add:
          type: array
          items:
            type: string
            example: https://some.host.com/some/path
        remove:
          type: array
          items:
            type: string
            example: https://some.host.com/some/path