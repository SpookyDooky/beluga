version: '3'

services:
  silo:
    image: docker.io/pgsty/silo:9.9
    container_name: silo
    ports:
      - "9000:9000"
      - "9001:9001" # Website
    environment:
      MINIO_ROOT_USER: user
      MINIO_ROOT_PASSWORD: password
    volumes:
      - ./data/minio:/data
    command: server /data --console-address ":9001"
  postgresql:
    user: root
    image: docker.io/postgres:17.0
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: test
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

# Stored as a docker volume (docker volume ls)
volumes:
  postgres-data: