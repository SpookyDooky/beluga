# For integration tests that use PostgreSQL but do not create jobs from spring properties
x-scraper:
  persistence:
    type: POSTGRESQL
    postgresql:
#      url: jdbc:postgresql://localhost:5432/test?currentSchema=x_scraper
      url: ${POSTGRE_HOST}
      username: username
      password: password
      driverClassName: org.postgresql.Driver
  result-datastore:
    type: FILE_SYSTEM