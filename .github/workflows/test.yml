name: Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      # SqlitePersistenceConfig hardcodes the database location to /app/db/sqlite.db.
      - name: Create SQLite directory
        run: sudo mkdir -p /app/db && sudo chown -R "$(id -u):$(id -g)" /app

      - name: Build, test and lint
        working-directory: src
        run: mvn --batch-mode --no-transfer-progress verify
