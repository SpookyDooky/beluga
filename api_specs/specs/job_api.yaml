openapi: 3.0.0
info:
  title: Job's REST API
  version: '1.0'
paths:
  /jobs:
    post:
      operationId: Job
      description: Creates a new job
      tags:
        - Job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/createJob"
      responses:
        200:
          description: OK

components:
  schemas:

    createJob:
      type: object
      properties:
        name:
          type: string
          example: job-name
        resultStorage:
          $ref: "#/components/schemas/createStorageConfiguration"
        execution:
          $ref: "#/components/schemas/createExecutionConfiguration"
        scraping:
          $ref: "#/components/schemas/createScrapingConfiguration"
      required:
        - name
        - resultStorage
        - execution
        - scraping

    createStorageConfiguration:
      type: object
      properties:
        folder:
          type: string
          example: /path/to/result/location
      required:
        - folder

    createExecutionConfiguration:
      type: object
      properties:
        workers:
          type: integer
          example: 1
        tasksPerSecond:
          type: integer
          example: 5
      required:
        - workers
        - tasksPerSecond

    createScrapingConfiguration:
      type: object
      properties:
        elementSelector:
          type: string
          example: main#content
          description: Css selector
        dataPoints:
          type: array
          items:
            $ref: "#/components/schemas/createScrapingDataPoint"
          minLength: 1
      required:
        - elementSelector
        - dataPoints

    createScrapingDataPoint:
      type: object
      properties:
        selector:
          type: string
          example: main#content
          description: Css selector
        propertyName:
          type: string
          example: name
          description: the name under which to store the scraped value
        attribute:
          type: string
          example: src
          description: Can be set in case a specific attribute of an HTML tag needs to be scraped
          nullable: true
        type:
          allOf:
            - $ref: "#/components/schemas/dataPointType"
          default: TEXT
      required:
        - selector
        - propertyName

    dataPointType:
      type: string
      enum:
        - IMAGE
        - TEXT
